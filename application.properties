# ThingsBoard Configuration for PostgreSQL on Windows
# File: application.properties
# Đặt file này cùng thư mục với thingsboard-4.3.0-SNAPSHOT.jar

# ====================
# DATABASE CONFIGURATION
# ====================

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/thingsboard
spring.datasource.username=postgres
spring.datasource.password=01041998@
spring.datasource.driverClassName=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximumPoolSize=16
spring.datasource.hikari.leakDetectionThreshold=0

# Database Type
database.ts.type=sql
database.ts_latest.type=sql

# ====================
# SERVER CONFIGURATION
# ====================

# HTTP Server
server.port=9090
server.address=0.0.0.0

# SSL (nếu cần)
# server.ssl.enabled=false

# ====================
# LOGGING
# ====================

# Log Level
logging.level.org.thingsboard=INFO
logging.level.org.springframework=WARN

# ====================
# QUEUE CONFIGURATION (Optional)
# ====================

# In-Memory Queue (mặc định cho development)
queue.type=in-memory

# Nếu dùng Kafka (production)
# queue.type=kafka
# queue.kafka.bootstrap.servers=localhost:9092

# ====================
# CACHE CONFIGURATION (Optional)
# ====================

# Redis Cache (nếu có)
# cache.type=redis
# redis.connection.type=standalone
# redis.standalone.host=localhost
# redis.standalone.port=6379

# In-memory cache (mặc định)
cache.type=caffeine

# ====================
# OTHER SETTINGS
# ====================

# JWT Token
# security.jwt.tokenExpirationTime=9000
# security.jwt.refreshTokenExpTime=604800

# CORS (nếu cần)
# security.cors.enabled=true

# Max file upload size
# spring.servlet.multipart.max-file-size=50MB
# spring.servlet.multipart.max-request-size=50MB
